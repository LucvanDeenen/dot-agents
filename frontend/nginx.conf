server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API routes proxied to the api service (same compose stack). Keep in sync
    # with the dev proxy in vite.config.ts.
    location ~ ^/(jobs|agents|skills|health) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # /jobs/events is a long-lived SSE stream — never buffer it.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
