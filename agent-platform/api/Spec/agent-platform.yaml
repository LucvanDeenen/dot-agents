openapi: 3.0.3
info:
  title: Agent Platform API
  version: "1.0"
  description: >
    Source-of-truth contract for the Agent Platform API. Controllers and
    models are generated from this file at build time (see nswag.json) —
    edit this spec first, then implement the generated abstract controller.

servers:
  - url: /api/v1

tags:
  - name: Task
  - name: System

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness/readiness probe.
      responses:
        "200":
          description: The service is healthy.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The service is unhealthy or degraded.
          content:
            text/plain:
              schema:
                type: string
  /tasks:
    post:
      tags: [Task]
      operationId: assignTask
      summary: Create a new agent task and publish it to the task queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
      responses:
        "202":
          description: The task was persisted and published to the task queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: The request body failed validation (e.g. missing prompt).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"

components:
  schemas:
    TaskRequest:
      type: object
      properties:
        context:
          type: string
        action:
          type: string
        system:
          type: string
    AgentResponse:
      type: object
      required: [response]
      properties:
        response:
          type: string
        action:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
