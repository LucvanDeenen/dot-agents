openapi: 3.0.3
info:
  title: Agent Platform API
  version: "1.0"
  description: >
    Source-of-truth contract for the Agent Platform API. Controllers and
    models are generated from this file at build time (see nswag.json) —
    edit this spec first, then implement the generated abstract controller.

servers:
  - url: /

tags:
  - name: System
  - name: Jobs
  - name: Agents
  - name: Skills

paths:
  /health:
    get:
      tags: [System]
      operationId: getHealth
      summary: Liveness/readiness probe.
      responses:
        "200":
          description: The service is healthy.
          content:
            text/plain:
              schema:
                type: string
        "503":
          description: The service is unhealthy or degraded.
          content:
            text/plain:
              schema:
                type: string

  /jobs:
    post:
      tags: [Jobs]
      operationId: createJob
      summary: Create a new agent task and publish it to the task queue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateJobRequest"
      responses:
        "201":
          description: The task was persisted and published to the task queue.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "202":
          description: >
            The task was persisted but could not be published to the task
            queue and will need to be retried.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "400":
          description: The request body failed validation (e.g. missing prompt).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List the 50 most recently created agent tasks.
      responses:
        "200":
          description: A page of agent tasks, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AgentTask"

  /jobs/{id}:
    get:
      tags: [Jobs]
      operationId: getJobById
      summary: Get a single agent task by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested agent task.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTask"
        "404":
          description: No agent task exists with the given id.
    delete:
      tags: [Jobs]
      operationId: deleteJob
      summary: Delete an agent task. Tasks that are currently running cannot be deleted.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The task was deleted.
        "404":
          description: No agent task exists with the given id.
        "409":
          description: The task is currently running and cannot be deleted.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

  /agents:
    get:
      tags: [Agents]
      operationId: listAgents
      summary: List all agent definitions (skills included).
      responses:
        "200":
          description: All configured agents.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      tags: [Agents]
      operationId: createAgent
      summary: Create a new agent definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAgentRequest"
      responses:
        "201":
          description: The created agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "400":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"

  /agents/{id}:
    get:
      tags: [Agents]
      operationId: getAgentById
      summary: Get a single agent by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: No agent exists with the given id.
    put:
      tags: [Agents]
      operationId: updateAgent
      summary: Replace an agent definition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertAgentRequest"
      responses:
        "200":
          description: The updated agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: No agent exists with the given id.
    delete:
      tags: [Agents]
      operationId: deleteAgent
      summary: Delete an agent definition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The agent was deleted.
        "404":
          description: No agent exists with the given id.

  /skills:
    get:
      tags: [Skills]
      operationId: listSkills
      summary: List all skill definitions.
      responses:
        "200":
          description: All configured skills.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Skill"
    post:
      tags: [Skills]
      operationId: createSkill
      summary: Create a new skill definition.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSkillRequest"
      responses:
        "201":
          description: The created skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "400":
          description: The request body failed validation.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"

  /skills/{id}:
    get:
      tags: [Skills]
      operationId: getSkillById
      summary: Get a single skill by id.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The requested skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          description: No skill exists with the given id.
    put:
      tags: [Skills]
      operationId: updateSkill
      summary: Replace a skill definition.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertSkillRequest"
      responses:
        "200":
          description: The updated skill.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Skill"
        "404":
          description: No skill exists with the given id.
    delete:
      tags: [Skills]
      operationId: deleteSkill
      summary: Delete a skill definition. Fails while agents still reference it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: The skill was deleted.
        "404":
          description: No skill exists with the given id.
        "409":
          description: The skill is still referenced by one or more agents.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    AgentTaskStatus:
      type: integer
      format: int32
      enum: [0, 1, 2, 3, 4]
      x-enumNames: [Pending, Queued, Running, Completed, Failed]

    AgentTask:
      type: object
      required: [id, routingKey, instruction, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        routingKey:
          type: string
        instruction:
          type: string
        status:
          $ref: "#/components/schemas/AgentTaskStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        agentId:
          type: string
          format: uuid
          nullable: true
        agentName:
          type: string
          nullable: true
        repoUrl:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        output:
          type: string
          nullable: true

    CreateJobRequest:
      type: object
      required: [prompt]
      properties:
        prompt:
          type: string
        repoUrl:
          type: string
          nullable: true
        branch:
          type: string
          nullable: true
        agentId:
          description: >
            Pin the task to a specific agent. When omitted, the dispatcher
            resolves an agent by matching routingKey against each enabled
            agent's routing-key pattern.
          type: string
          format: uuid
          nullable: true
        routingKey:
          description: Topic routing key for the task; defaults to task.created.
          type: string
          nullable: true

    Agent:
      type: object
      required: [id, name, systemPrompt, allowedTools, routingKeyPattern, enabled, createdAt, skills]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        systemPrompt:
          type: string
        allowedTools:
          type: array
          items:
            type: string
        routingKeyPattern:
          type: string
        enabled:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true
        skills:
          type: array
          items:
            $ref: "#/components/schemas/Skill"

    UpsertAgentRequest:
      type: object
      required: [name, systemPrompt, routingKeyPattern]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        systemPrompt:
          type: string
        allowedTools:
          type: array
          items:
            type: string
          nullable: true
        routingKeyPattern:
          type: string
        enabled:
          type: boolean
          default: true
        skillIds:
          type: array
          items:
            type: string
            format: uuid
          nullable: true

    Skill:
      type: object
      required: [id, name, instructions, createdAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
          nullable: true

    UpsertSkillRequest:
      type: object
      required: [name, instructions]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        instructions:
          type: string

    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: true

    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
