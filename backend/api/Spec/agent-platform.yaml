openapi: 3.0.3
info:
  title: Agent Platform API
  version: "1.0"
  description: >
    Source-of-truth contract for the Agent Platform API. Controllers and
    models are generated from this file at build time (see nswag.json) —
    edit this spec first, then implement the generated abstract controller.

servers:
  - url: /api/v1

tags:
  - name: Task
  - name: System

paths:
  /tasks:
    post:
      tags: [Task]
      operationId: assignTask
      summary: Start an agent for a task and return its first response.
      description: >
        Spins up an agent runner for the task and returns the agent's first
        response together with a runId. The runner stays alive for a short
        window so the conversation can be continued via POST /tasks/{runId}/messages.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskRequest"
      responses:
        "200":
          description: The agent started and produced its first response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "400":
          description: The request body failed validation (e.g. missing prompt).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
  /tasks/{runId}/messages:
    post:
      tags: [Task]
      operationId: continueTask
      summary: Send a follow-up message to a running agent session.
      description: >
        Continues the conversation with the agent started by POST /tasks,
        resuming its session, and returns the agent's next response.
      parameters:
        - name: runId
          in: path
          required: true
          description: The runId returned by POST /tasks.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageRequest"
      responses:
        "200":
          description: The agent produced its next response.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentResponse"
        "404":
          description: No live run exists for the given runId (it never existed or its session already closed).
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"

components:
  schemas:
    TaskRequest:
      type: object
      properties:
        context:
          type: string
        action:
          type: string
        system:
          type: string
    MessageRequest:
      type: object
      required: [message]
      properties:
        message:
          type: string
    AgentResponse:
      type: object
      required: [response, runId]
      properties:
        response:
          type: string
        runId:
          type: string
          description: Id of the live run; pass it to POST /tasks/{runId}/messages to continue.
        action:
          type: string
    ProblemDetails:
      type: object
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
          format: int32
          nullable: true
        detail:
          type: string
          nullable: true
        instance:
          type: string
          nullable: true
      additionalProperties: true
    ValidationProblemDetails:
      allOf:
        - $ref: "#/components/schemas/ProblemDetails"
        - type: object
          required: [errors]
          properties:
            errors:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
